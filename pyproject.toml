[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integration-incident-monitor"
version = "0.1.0"
description = "API para detectar falhas repetidas em integrações e acompanhar incidentes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
ai = [
  "httpx>=0.28,<1.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]


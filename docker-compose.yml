services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidents}
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - incident_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/${POSTGRES_DB:-incidents}
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/${POSTGRES_DB:-incidents}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/${POSTGRES_DB:-incidents}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      DELIVERY_BASE_DELAY_SECONDS: ${DELIVERY_BASE_DELAY_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  incident_pgdata:
